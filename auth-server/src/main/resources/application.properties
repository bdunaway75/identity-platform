spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.application.name=spring-backend-auth
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=auth

auth-server.frontend.client-id=${AUTH_SERVER_FRONTEND_CLIENT_ID}
auth-server.frontend.origin=${AUTH_SERVER_FRONTEND_ORIGIN}
auth-server.platform.allowed-origins=${AUTH_SERVER_PLATFORM_ALLOWED_ORIGINS}
auth-server.issuer=${AUTH_SERVER_ISSUER}
auth-server.beta-mode=${BETA_MODE:false}
auth-server.support-email=${AUTH_SERVER_SUPPORT_EMAIL}
auth-server.validation.password-min-length=8
auth-server.validation.password-max-length=72

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
stripe.secret-key = ${STRIPE_SECRET_KEY}
stripe.billing-portal.configuration-id=${STRIPE_BILLING_PORTAL_CONFIGURATION_ID:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

security.token.pepper-base64=${SECURITY_TOKEN_PEPPER_BASE64}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:stripeWebhookSecret}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
